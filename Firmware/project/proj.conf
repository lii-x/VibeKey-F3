# 09-05: L2CAP ATT MTU 65→128 —— 键配置 READ 回包(70B)/WRITE 帧(69B)超默认单帧
# 上限(65-3=62B), BLE 通道需要一次 notify/写携带全帧。Windows 端自动请求更大 MTU,
# 协商结果 = min(128, 对端)。RAM 增量 ≈ TX buf 数 × 63B, 可接受。
# 09-05: 128→247 —— READ 回包 104→158B / WRITE 帧 8+151=159B(C 键三手势追加),
# 需 MTU-3 >= 162, 128 不够(125B), 提到 247 一次到位。
# 09-07: 247→300 —— READ 回包 192→276B / WRITE 帧 8+269=277B(L 键模式+手势追加),
# 需 MTU-3 >= 277, 247 不够(244B), 提到 300 一次到位(载荷 297B)。
# 09-07: 300→340 —— READ 回包 276→304B / WRITE 帧 8+297=305B(EC 按下模式+手势追加),
# 需 MTU-3 >= 305, 300 不够(297B), 提到 340 一次到位(载荷 337B)。
# 10-05: MTU 保持 340 —— READ 回包 304→324B / WRITE 帧 8+315=323B(EC 按压滚动追加),
# 需 MTU-3 >= 324, 340-3=337 已满足, 无需再提。
# ⚠️ 配置改动需删 build 目录重建或重跑 menuconfig 才生效。
CONFIG_BT_L2CAP_TX_MTU=340
# ⚠️ SDK 层自动重连(BT_AUTO_CONNECT_LAST_DEVICE)必须关闭(08-07 定案)：
# 它会在经典蓝牙 ACL 超时断开(reason=CONN_TIMEOUT)后自动发起 page 重连，
# 且重连期间关 page scan、失败才开 —— 与固件自研回连(ble_app.c: page scan
# 窗口 + hfp_connect_timer 主动连接 + 15 次重试自愈)双重重连并存：
# ① scan 开关互相覆盖(手机回连失败) ② 两个 page 请求并发(控制器拒绝/取消)
# → 偶发"连不上/连得慢"。自研回连覆盖场景更全(任意 HFP 断开都重试)，关闭
# SDK 版避免冲突。
# CONFIG_BT_AUTO_CONNECT_LAST_DEVICE is not set
# CONFIG_BSP_BT_APP is not set
CONFIG_BTS2_APP_MENU=y
CONFIG_USING_BUTTON_LIB=y
CONFIG_BUTTON_MAX_NUM=7
# 09-05: 按键长按判定 3000→800ms —— C 键三手势的"长按"阈值(SDK button 库全局,
# BUTTON_ADV_ACTION_CHECK_DELAY)。全固件只有 C 键手势分发消费 LONG_PRESSED,
# 其余按键(L1 空中鼠标 HOLD/L2/L3 拖动/EC)忽略该事件, 缩短无副作用。
CONFIG_BUTTON_ADV_ACTION_CHECK_DELAY=800
